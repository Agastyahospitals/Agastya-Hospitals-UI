services:
  - type: web
    name: agastya-hospitals-user
    env: static
    buildCommand: npm run build
    staticPublishPath: dist
    headers:
      - path: /sitemap.xml
        name: Content-Type
        value: application/xml
      - path: /robots.txt
        name: Content-Type
        value: text/plain
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
